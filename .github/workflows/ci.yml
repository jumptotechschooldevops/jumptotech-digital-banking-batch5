name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: every job can read the repo and nothing else.
# Individual jobs elevate only the specific permission they need (see the
# trivy job, which needs security-events: write to upload its SARIF report).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven + Testcontainers/PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Run backend test suite
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies
        working-directory: frontend
        # Informational: fails the step (not the whole job) only on high/critical findings,
        # so a new transitive advisory doesn't block merges without anyone noticing it first.
        run: npm audit --audit-level=high
        continue-on-error: true

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required only for uploading the SARIF reports below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Split into two scans rather than one repo-wide scan so each stack's gate
      # reflects its own actual state. Both are blocking: the backend upgraded off
      # Spring Boot 3.3.4 (EOL) to 4.1.2, which cleared its previously pre-existing
      # CRITICAL/HIGH CVEs (Tomcat, Spring Framework/Security, Jackson, BouncyCastle),
      # so there is no longer a reason to let it pass with known findings.
      #
      # A HIGH/CRITICAL finding now fails the build unless it has a documented,
      # reviewed exception in backend/.trivyignore or frontend/.trivyignore (each
      # entry there must record the CVE, why it can't be fixed yet, who approved it,
      # and a review/expiry date - see the comments in those files).
      - name: Scan frontend dependencies (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          trivyignores: frontend/.trivyignore
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan backend dependencies (blocking)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          trivyignores: backend/.trivyignore
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload frontend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload backend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
